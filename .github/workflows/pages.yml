# Compile l'app en mode « navigateur » (données dans IndexedDB) et la publie sur GitHub Pages.
# Réglage requis une fois : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
name: Déployer sur GitHub Pages

on:
  push:
    branches: [main, claude/gifted-bardeen-jlwfzw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_STORAGE: local
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
